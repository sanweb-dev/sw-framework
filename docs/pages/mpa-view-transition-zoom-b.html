    <link rel="stylesheet" href="../dist/sw.min.css">
    <link rel="stylesheet" href="../css/layout.css?v=11">

    <style>
        .demo-wrap {
            background: var(--sw-bg-bas);
            border: 1px solid var(--sw-bor);
            border-radius: var(--sw-r-g);
            padding: 2.4rem;
            margin-bottom: .8rem;
        }

        @keyframes demo-zoom-out {
            0% { transform: scale(1); opacity: 1; }
            60% { transform: scale(0.55); opacity: 1; }
            100% { transform: scale(0.4); opacity: 0; }
        }
        @keyframes demo-zoom-in {
            0% { transform: scale(1.8); opacity: 0; }
            40% { transform: scale(1.8); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        html::view-transition-old(root) { animation: 550ms cubic-bezier(0.4, 0, 0.2, 1) both demo-zoom-out; }
        html::view-transition-new(root) { animation: 550ms cubic-bezier(0.4, 0, 0.2, 1) both demo-zoom-in; }
    </style>
    <script src="../dist/sw.min.js" defer></script>
  <script src="../layout/header.js" defer></script>
