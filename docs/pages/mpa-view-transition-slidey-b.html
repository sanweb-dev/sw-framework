            margin-bottom: .8rem;
        }

        @keyframes demo-slide-out-top { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0.7; } }
        @keyframes demo-slide-in-bottom { from { transform: translateY(100%); opacity: 0.7; } to { transform: translateY(0); opacity: 1; } }
        html::view-transition-old(root) { animation: 450ms cubic-bezier(0.25, 1, 0.5, 1) both demo-slide-out-top; }
        html::view-transition-new(root) { animation: 450ms cubic-bezier(0.25, 1, 0.5, 1) both demo-slide-in-bottom; }
    </style>
