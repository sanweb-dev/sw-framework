<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgMon)"/>
  <!-- Monitor Stand -->
  <rect x="360" y="360" width="80" height="90" fill="#4b5563"/>
  <ellipse cx="400" cy="450" rx="140" ry="20" fill="#374151"/>
  <!-- Screen Bezel -->
  <rect x="120" y="60" width="560" height="310" rx="12" fill="#111827" stroke="#374151" stroke-width="6"/>
  <!-- Screen Display -->
  <rect x="130" y="70" width="540" height="290" rx="6" fill="url(#screen)"/>
  <text x="400" y="210" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">4K IPS UltraSharp</text>
  <text x="400" y="250" font-family="sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">HDR400 · 99% sRGB · USB-C Hub</text>
</svg>
