<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glowGrid">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrid)"/>
  <circle cx="400" cy="250" r="180" fill="#34d399" opacity="0.25" filter="url(#glowGrid)"/>
  <!-- Speedometer & Performance Gauge -->
  <path d="M 220,340 A 180,180 0 1,1 580,340" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 220,340 A 180,180 0 1,1 540,210" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round"/>
  <circle cx="400" cy="340" r="20" fill="#ffffff"/>
  <line x1="400" y1="340" x2="520" y2="220" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="300" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">100</text>
  <text x="400" y="420" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="4">LIGHTHOUSE PERFORMANCE</text>
</svg>
